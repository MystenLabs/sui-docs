name: Mirror external docs

# Pulls every mirrored source in sources.json and commits what changed.
#
# The build reads the committed tree rather than fetching, so three things hold:
# the repository always shows exactly what the sites last published, a broken or
# mid-merge upstream state cannot reach a build, and if this job fails the sites
# freeze on the last good content instead of publishing something half-fetched.
#
# The schedule is what actually syncs. The repository_dispatch trigger below
# works and would sync within a minute, but no source repo sends one yet, so in
# practice every update waits for the next scheduled run and worst-case
# staleness is the cron interval. To get minute-level syncing, add a job to each
# source repo's docs workflow that dispatches `docs-changed` here; until then,
# do not promise freshness tighter than the cron.

on:
  repository_dispatch:
    types: [docs-changed]
  schedule:
    # Every 30 minutes, because this is the only path that actually syncs (see
    # above) and a run costs ~30s. Four-hourly meant a source could sit unmirrored
    # for most of a working day, which is how it was first noticed.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      sources:
        description: "Space-separated source names, or empty for all"
        type: string
        required: false
      dry_run:
        description: "Fetch and compare, commit nothing"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch sources
        env:
          SOURCES: ${{ inputs.sources }}
          # A dispatch names the source that changed, so a push to one repo
          # does not refetch all nine.
          DISPATCH_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          set -euo pipefail
          TARGETS="${SOURCES:-${DISPATCH_SOURCE:-}}"
          echo "targets: ${TARGETS:-<all>}"
          node scripts/fetch-sources.js --force $TARGETS

      - name: Mirror into content/
        env:
          SOURCES: ${{ inputs.sources }}
          DISPATCH_SOURCE: ${{ github.event.client_payload.source }}
        run: |
          set -euo pipefail
          TARGETS="${SOURCES:-${DISPATCH_SOURCE:-}}"
          node scripts/mirror.js $TARGETS

      - name: Commit
        if: inputs.dry_run != true
        run: |
          set -euo pipefail
          git config user.name "mysten-docs-bot[bot]"
          git config user.email "mysten-docs-bot[bot]@users.noreply.github.com"
          git add content/ sources.lock.json
          if git diff --cached --quiet; then
            echo "No change."
            exit 0
          fi
          git diff --cached --stat
          git commit -m "mirror: sync external docs"

          # Anything else pushing to main between this job's checkout and its
          # push makes the push non-fast-forward. That used to fail the run and
          # lose the sync until the next schedule, four hours later. Rebase onto
          # the new tip and retry instead.
          #
          # A conflict here should be impossible: the concurrency group
          # serialises mirror runs, so the other side is a human or another
          # workflow, and neither writes what this job writes. Mirrored content
          # is guarded against hand edits, and only this job writes
          # sources.lock.json. So treat a conflict as a broken assumption and
          # stop, rather than resolving it blind.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt of 3), rebasing onto origin/main"
            # The default checkout is shallow and has no merge base to rebase
            # against. Deepen only here, so the common path stays cheap.
            if [ "$(git rev-parse --is-shallow-repository)" = true ]; then
              git fetch --unshallow origin
            else
              git fetch origin
            fi
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::error::mirror commit conflicts with origin/main. Rerun this workflow."
              exit 1
            fi
          done
          echo "::error::push still rejected after 3 attempts."
          exit 1

      - name: Report (dry run)
        if: inputs.dry_run == true
        run: |
          git --no-pager diff --stat || true
          echo "Dry run: nothing committed."
