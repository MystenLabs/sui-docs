name: Guard mirrored paths

# A mirrored file is a copy. Editing it here looks like it works, renders
# correctly in preview, and is silently reverted by the next mirror run. The
# generated header on each file warns a reader and CODEOWNERS makes a reviewer
# look, but only this check actually stops it.
#
# It is deliberately not a lecture: the job writes the upstream path and a link
# for every offending file, so the author can land the change where it belongs
# without hunting for it.

# It runs on pushes to main as well as on pull requests. Guarding only pull
# requests leaves the obvious route unguarded: committing through the GitHub web
# editor, which is how anyone makes a quick docs fix, pushes straight to main.
# An edit that arrives that way is reverted by the next scheduled mirror run,
# hours later and without a word. Failing here is the only notice anyone gets.

on:
  pull_request:
    paths:
      - "content/**"
  push:
    branches: [main]
    paths:
      - "content/**"

permissions:
  contents: read

jobs:
  guard:
    name: Mirrored paths are read-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The guard compares the tree against what the mirror produces, so it needs
      # the upstream sources on disk. Without them it cannot tell mirror output
      # from a hand edit, and says so rather than guessing.
      - name: Fetch the mirrored sources
        run: node scripts/fetch-sources.js

      # A pull request compares base against head. A push compares what was there
      # before against what is there now, and `before` is all zeroes on the first
      # push to a branch, so fall back to the commit's own parent.
      - name: Resolve the range to check
        id: range
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            before="${{ github.event.before }}"
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              before="$(git rev-parse '${{ github.sha }}^')"
            fi
            echo "base=$before" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for hand edits to mirrored files
        id: check
        run: |
          node scripts/check-mirror-edits.js \
            --base "${{ steps.range.outputs.base }}" \
            --head "${{ steps.range.outputs.head }}" \
            --json "$RUNNER_TEMP/offending.json"

      # Runs only when the guard failed. A job summary rather than a pull request
      # comment: the ::error annotations the script emits already land inline on
      # the diff, and this repo does not comment on pull requests.
      - name: Explain in the job summary
        if: failure() && steps.check.outcome == 'failure'
        run: |
          node -e '
            const fs = require("fs");
            const { offending } = JSON.parse(
              fs.readFileSync(process.env.RUNNER_TEMP + "/offending.json", "utf8"));
            const rows = offending.map((o) =>
              `| \`${o.file}\` | [\`${o.upstreamPath}\`](https://github.com/${o.repo}/blob/${o.ref}/${o.upstreamPath}) |`
            ).join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, [
              "### These files are mirrored, not authored here",
              "",
              "They are overwritten by the next mirror run, so an edit made here is lost",
              "within hours and without a notice. This check is the notice.",
              "",
              "| File in this repo | Source of truth |",
              "| --- | --- |",
              rows,
              "",
              process.env.GITHUB_EVENT_NAME === "push"
                ? "This landed on main, so the edit is live now and the next scheduled "
                  + "mirror run will revert it. Send it upstream with the forward-port "
                  + "workflow from the Actions tab, or edit the source repository directly."
                : "Run the forward-port workflow from the Actions tab to send these to the "
                  + "source repositories, or drop these files from the pull request.",
              "",
            ].join("\n"));
          '
