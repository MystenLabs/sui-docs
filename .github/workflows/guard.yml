name: Guard mirrored paths

# A mirrored file is a copy. Editing it here looks like it works, renders
# correctly in preview, and is silently reverted by the next mirror run. The
# generated header on each file warns a reader and CODEOWNERS makes a reviewer
# look, but only this check actually stops it.
#
# It is deliberately not a lecture: the job writes the upstream path and a link
# for every offending file, so the author can land the change where it belongs
# without hunting for it.

on:
  pull_request:
    paths:
      - "content/**"

permissions:
  contents: read

jobs:
  guard:
    name: Mirrored paths are read-only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check for hand edits to mirrored files
        id: check
        run: |
          node scripts/check-mirror-edits.js \
            --base "${{ github.event.pull_request.base.sha }}" \
            --head "${{ github.event.pull_request.head.sha }}" \
            --json "$RUNNER_TEMP/offending.json"

      # Runs only when the guard failed, so the author gets the upstream links
      # in the pull request rather than having to open the job log.
      - name: Explain on the pull request
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { offending } = JSON.parse(
              fs.readFileSync(process.env.RUNNER_TEMP + '/offending.json', 'utf8'));
            const rows = offending.map(o =>
              `| \`${o.file}\` | [\`${o.upstreamPath}\`](https://github.com/${o.repo}/blob/main/${o.upstreamPath}) |`
            ).join('\n');
            const body = [
              '### These files are mirrored, not authored here',
              '',
              'They are overwritten by the next mirror run, so an edit made here would be lost.',
              'Make the change in the source repository instead:',
              '',
              '| File in this repo | Edit this instead |',
              '| --- | --- |',
              rows,
              '',
              'Everything else in this pull request is fine. Removing these files from it will clear the check.',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body,
            });
